<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talin Theme Tokens · Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="examples.css" />
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="tokens.js"></script>
    <script src="app.js"></script>
    <script type="module">
      const isLocalPreview =
        location.protocol === "file:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.hostname === "::1";

      if (isLocalPreview) {
        try {
          const [{ Agentation }, React, { createRoot }] = await Promise.all([
            import("https://esm.sh/agentation@3.0.2?deps=react@18.3.1,react-dom@18.3.1"),
            import("https://esm.sh/react@18.3.1"),
            import("https://esm.sh/react-dom@18.3.1/client"),
          ]);
          const container = document.createElement("div");
          container.id = "agentation-root";
          document.body.appendChild(container);
          createRoot(container).render(React.createElement(Agentation));
        } catch (error) {
          console.warn("Agentation failed to load:", error);
        }
      }
    </script>
  </body>
</html>
